<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – TechNova Tag Studio</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .auth-container {
      max-width: 440px;
      margin: 50px auto;
      padding: 32px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 8px 0 4px;
      color: var(--text);
    }
    .auth-header p {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel-2);
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent-teal);
      box-shadow: 0 0 0 3px rgba(0, 113, 133, 0.15);
    }
    .alert-banner {
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .alert-error {
      background: rgba(186, 9, 51, 0.1);
      border: 1px solid var(--rose);
      color: var(--rose);
    }
    .alert-success {
      background: rgba(6, 125, 98, 0.1);
      border: 1px solid var(--green);
      color: var(--green);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: 1px solid var(--primary-border);
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-text);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(213, 217, 217, 0.5);
      transition: background 0.15s ease;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--accent-teal);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .flex-row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <a th:href="@{/}" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;">
        <span style="font-size:20px;">⚡</span>
        <span style="font-weight:800;font-size:18px;">TechNova Tag Studio</span>
      </a>
    </div>
    <div style="display:flex;gap:12px;align-items:center;">
      <a th:href="@{/register}" style="color:#fff;text-decoration:none;font-size:13px;font-weight:600;">Create Account</a>
    </div>
  </div>

  <div class="auth-container">
    <div class="auth-header">
      <h1>Sign In</h1>
      <p>Access your workspace, saved metadata & AI console</p>
    </div>

    <div th:if="${errorMessage}" class="alert-banner alert-error">
      <span th:text="${errorMessage}"></span>
      <div th:if="${errorMessage != null && errorMessage.contains('verified')}" style="margin-top:8px;">
        <a th:href="@{/resend-verification}" style="color:var(--text);font-weight:700;text-decoration:underline;">Click here to resend verification email</a>
      </div>
    </div>

    <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
      </div>

      <div class="form-group">
        <div class="flex-row-between">
          <label for="password" style="margin-bottom:0;">Password</label>
          <a th:href="@{/forgot-password}" style="font-size:12px;color:var(--accent-teal);text-decoration:none;">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="auth-footer">
      New to TechNova Tag Studio? <a th:href="@{/register}">Create an account</a>
    </div>
  </div>
</body>
</html>
