<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – TechNova Tag Studio</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .auth-container {
      max-width: 480px;
      margin: 40px auto;
      padding: 32px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 8px 0 4px;
      color: var(--text);
    }
    .auth-header p {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel-2);
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent-teal);
      box-shadow: 0 0 0 3px rgba(0, 113, 133, 0.15);
    }
    .password-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .field-error {
      font-size: 12px;
      color: var(--rose);
      margin-top: 4px;
      font-weight: 500;
    }
    .alert-banner {
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .alert-error {
      background: rgba(186, 9, 51, 0.1);
      border: 1px solid var(--rose);
      color: var(--rose);
    }
    .alert-success {
      background: rgba(6, 125, 98, 0.1);
      border: 1px solid var(--green);
      color: var(--green);
    }
    .terms-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: var(--text);
      margin: 18px 0;
    }
    .terms-box input[type="checkbox"] {
      margin-top: 3px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: 1px solid var(--primary-border);
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-text);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(213, 217, 217, 0.5);
      transition: background 0.15s ease;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--accent-teal);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <a th:href="@{/}" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;">
        <span style="font-size:20px;">⚡</span>
        <span style="font-weight:800;font-size:18px;">TechNova Tag Studio</span>
      </a>
    </div>
    <div style="display:flex;gap:12px;align-items:center;">
      <a th:href="@{/login}" style="color:#fff;text-decoration:none;font-size:13px;font-weight:600;">Sign In</a>
    </div>
  </div>

  <div class="auth-container">
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Register to save metadata, generate optimized tags & use Studio AI</p>
    </div>

    <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" th:object="${registerDTO}" method="post">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Jane Doe" required autofocus>
        <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
        <div class="password-hint">At least 8 characters with uppercase, lowercase, number, and special character.</div>
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••" required>
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
      </div>

      <div class="terms-box">
        <input type="checkbox" id="agreeTerms" th:field="*{agreeTerms}" required>
        <label for="agreeTerms">I agree to the TechNova Tag Studio Terms of Service and Privacy Policy</label>
      </div>
      <div class="field-error" th:if="${#fields.hasErrors('agreeTerms')}" th:errors="*{agreeTerms}"></div>

      <button type="submit" class="btn-submit">Register & Continue</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a th:href="@{/login}">Sign in here</a>
    </div>
  </div>
</body>
</html>
