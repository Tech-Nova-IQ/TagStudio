<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – TechNova Tag Studio</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .auth-container {
      max-width: 440px;
      margin: 50px auto;
      padding: 32px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-header h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 8px 0 4px;
      color: var(--text);
    }
    .auth-header p {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel-2);
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    .alert-banner {
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .alert-success {
      background: rgba(6, 125, 98, 0.1);
      border: 1px solid var(--green);
      color: var(--green);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: 1px solid var(--primary-border);
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-text);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(213, 217, 217, 0.5);
    }
    .btn-submit:hover {
      background: var(--primary-hover);
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--accent-teal);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <a th:href="@{/}" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;">
        <span style="font-size:20px;">⚡</span>
        <span style="font-weight:800;font-size:18px;">TechNova Tag Studio</span>
      </a>
    </div>
    <div style="display:flex;gap:12px;align-items:center;">
      <a th:href="@{/login}" style="color:#fff;text-decoration:none;font-size:13px;font-weight:600;">Sign In</a>
    </div>
  </div>

  <div class="auth-container">
    <div class="auth-header">
      <h1>Forgot Password</h1>
      <p>Enter your registered email address to receive password reset instructions.</p>
    </div>

    <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/forgot-password}" method="post">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
      </div>

      <button type="submit" class="btn-submit">Send Password Reset Link</button>
    </form>

    <div class="auth-footer">
      Remembered your password? <a th:href="@{/login}">Back to Sign In</a>
    </div>
  </div>
</body>
</html>
