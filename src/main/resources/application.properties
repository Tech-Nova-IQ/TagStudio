# Application Configuration
spring.application.name=technova-tag-studio
server.port=${PORT:8081}

# Thymeleaf settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging Configuration
logging.level.root=INFO
logging.level.com.technova.tagstudio=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Database Configuration (H2 embedded file-based or in-memory)
spring.datasource.url=jdbc:h2:file:./data/tagstudio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Email Configuration (environment variable driven — fallback to mock/console if unconfigured)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
mail.from=${MAIL_FROM:noreply@technovaiq.com}

# Application Base URL & Token Settings
app.base-url=${APP_BASE_URL:http://localhost:8081}
app.verification-token-expiry-hours=${APP_VERIFICATION_TOKEN_EXPIRY:24}

# First Administrator Bootstrap (Configurable via environment variables)
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.name=${ADMIN_NAME:TechNova Administrator}
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@technovaiq.com}
app.bootstrap.admin.password=${ADMIN_PASSWORD:Admin@TechNova2026!}

# Gemini Configuration (key read from GEMINI_API_KEY environment variable — never hardcode)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.8-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
